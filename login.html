<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostWork - Iniciar Sesión</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333;">

    <nav style="background-color: #1a1a1a; padding: 20px; text-align: center;">
        <h2 style="color: white; margin-top: 0; display: inline-block; margin-right: 30px;">PostWork</h2>
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Inicio</a>
        <a href="blog.html" style="color: white; text-decoration: none; margin: 0 15px;">Blog / Recursos</a>
        <a href="FAQ.html" style="color: white; text-decoration: none; margin: 0 15px;">FAQ</a>
        <div style="display: inline-block; margin-left: 25px;">
            <a href="login.html" style="color: white; border: 1px solid #2563eb; background-color: #2563eb; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; text-decoration: none;">Iniciar Sesión</a>
            <a href="registro.html" style="color: #cbd5e1; border: 1px solid #475569; padding: 7px 14px; border-radius: 4px; font-size: 13px; text-decoration: none;">Registrarse</a>
        </div>
    </nav>

    <main style="max-width: 420px; margin: 60px auto; padding: 0 20px;">
        <div style="background: white; padding: 40px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            
            <header style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 24px; color: #1a1a1a; margin-top: 0;">Iniciar Sesión</h1>
                <p style="color: #64748b; font-size: 14px;">Ingrese sus credenciales de acceso</p>
            </header>

            <!-- Formulario con method y action -->
            <form action="/login.php" method="POST">
                
                <div style="margin-bottom: 20px;">
                    <label for="email" style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tu_correo@ejemplo.com" maxlength="100" autocomplete="email" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label for="password" style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" minlength="6" maxlength="64" autocomplete="current-password" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit" style="width: 100%; background-color: #2563eb; color: white; border: none; border-radius: 4px; padding: 12px; font-size: 15px; cursor: pointer; font-weight: bold;">Ingresar</button>
            </form>

        </div>
    </main>
</body>
</html>

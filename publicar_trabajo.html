<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostWork - Publicar Oferta</title>
</head>
<body>

    <!-- Barra de navegación para la sección de publicación -->
    <nav style="background-color: #2563eb; padding: 10px;">
        <a href="#" style="color: white; font-weight: bold; text-decoration: none; margin-right: 20px;">PostWork</a>
        <a href="#" style="color: white; text-decoration: none; margin-right: 15px;">Inicio</a>
        <a href="#" style="color: white; text-decoration: none; margin-right: 15px;">Buscar Empleo</a>
        <a href="#" style="color: white; text-decoration: none;">Mi Perfil</a>
    </nav>

    <!-- Encabezado de la oferta -->
    <header style="background-color: #2563eb; color: white; padding: 20px; text-align: center;">
        <h1>Publicar nueva oferta de trabajo</h1>
    </header>

    <br>

    <!-- Formulario para cargar una oferta de trabajo -->
    <main>
        <section>
            <h2>Especificaciones de la vacante</h2>
            
            <form action="#" method="POST">
                <p>
                    <label for="titulo"><strong>Título del puesto</strong></label><br>
                    <input type="text" id="titulo" placeholder="Ej: Desarrollador Full Stack" required style="width: 300px;">
                </p>

                <p>
                    <label for="categoria"><strong>Categoría / Industria</strong></label><br>
                    <select id="categoria" required>
                        <option value="">Seleccionar categoría...</option>
                        <option value="tecnologia">Tecnología</option>
                        <option value="diseno">Diseño</option>
                        <option value="salud">Salud</option>
                        <option value="educacion">Educación</option>
                        <option value="administraron">Administración</option>
                    </select>
                </p>

                <fieldset>
                    <legend><strong>Modalidad de la jornada</strong></legend>
                    <label><input type="radio" name="modalidad" value="presencial"> Presencial</label>
                    <label><input type="radio" name="modalidad" value="remoto" checked> Remoto</label>
                    <label><input type="radio" name="modalidad" value="hibrido"> Híbrido</label>
                </fieldset>

                <p>
                    <strong>Salario estimado mensual</strong><br>
                    <input type="number" placeholder="Desde" aria-label="Salario desde">
                    <input type="number" placeholder="Hasta" aria-label="Salario hasta">
                    <select aria-label="Moneda de pago">
                        <option value="ARS">ARS</option>
                        <option value="USD">USD</option>
                    </select>
                </p>

                <p>
                    <label for="jornada"><strong>Carga horaria</strong></label><br>
                    <select id="jornada">
                        <option value="full-time">Full-time</option>
                        <option value="part-time">Part-time</option>
                    </select>
                </p>

                <p>
                    <label for="experiencia"><strong>Experiencia requerida</strong></label><br>
                    <select id="experiencia">
                        <option value="sin-experiencia">Sin experiencia previa</option>
                        <option value="1-2">1-2 años de trayectoria</option>
                        <option value="3-5">3-5 años de trayectoria</option>
                        <option value="5+">+5 años de trayectoria</option>
                    </select>
                </p>

                <p>
                    <label for="descripcion"><strong>Descripción de tareas</strong></label><br>
                    <textarea id="descripcion" rows="4" cols="50" placeholder="Describe las responsabilidades y objetivos del puesto..."></textarea>
                </p>

                <p>
                    <label for="requisitos"><strong>Requisitos excluyentes</strong></label><br>
                    <textarea id="requisitos" rows="4" cols="50" placeholder="Lista los requisitos necesarios para el puesto..."></textarea>
                </p>

                <p>
                    <label for="beneficios"><strong>Beneficios del puesto</strong></label><br>
                    <textarea id="beneficios" rows="4" cols="50" placeholder="Describe los beneficios que ofrece la empresa..."></textarea>
                </p>

                <p>
                    <label for="fecha-limite"><strong>Fecha límite de postulación</strong></label><br>
                    <input type="date" id="fecha-limite">
                </p>

                <p>
                    <button type="button">Guardar borrador</button>
                    <button type="submit" style="background-color: #2563eb; color: white; border: none; padding: 5px 10px;">Publicar oferta de inmediato</button>
                </p>

            </form>
        </section>
    </main>

    <!-- Pie de página de la sección de publicación -->
    <hr>
    <footer>
        <p>&copy; 2026 PostWork - Sistema de Carga de Vacantes Oficial.</p>
    </footer>

</body>
</html>
